# =============================================================================
# linkyee — Site Configuration
#
# This file is rendered through Liquid: every {{ ... }} below is evaluated
# at build time. Plugin output lives under `vars.<PluginName>` — see
# `plugins/README.md` for the full plugin developer wiki.
# =============================================================================

# Theme — directory under ./themes/
theme: minimal-mono

lang: "en"

# auto | light | dark
color_scheme: dark

# Build-time plugins. Latest YouTube Short is pulled from the channel's public feed (no API key).
plugins:
  - YouTubeChannelLatestVideoPlugin:
      - "UCVZY5qeppjMRBUktTN7Y9Ow"

google_analytics_id:

# -----------------------------------------------------------------------------
# Profile header
# -----------------------------------------------------------------------------
title: "Muhanned KP | IT & Cloud Tips"
avatar: "./images/profile.jpeg"
name: "@muhanned.kp"
tagline: >-
    IT Infrastructure & Cloud Specialist in Abu Dhabi 🇦🇪 Azure · Microsoft 365 · Windows Server · Security.
    Practical tech tips in 30 seconds.

# -----------------------------------------------------------------------------
# Links
# -----------------------------------------------------------------------------
links:
  - link:
      icon: "fa-brands fa-youtube"
      text: "Latest Short: {{ vars.YouTubeChannelLatestVideoPlugin['UCVZY5qeppjMRBUktTN7Y9Ow'].title | default: 'Watch my latest tip' }}"
      url: "{{ vars.YouTubeChannelLatestVideoPlugin['UCVZY5qeppjMRBUktTN7Y9Ow'].url | default: 'https://www.youtube.com/@muhannedkp/shorts' }}"
      alt: "Latest YouTube Short"
      title: "Latest YouTube Short"
      target: "_blank"
      latest: true
  - link:
      icon: "fa-brands fa-youtube"
      text: "YouTube <span class='link-button-text'>(IT & Cloud Tips)</span>"
      url: "https://www.youtube.com/@muhannedkp"
      alt: "Muhanned KP on YouTube"
      title: "Subscribe on YouTube"
      target: "_blank"
  - link:
      icon: "fa-brands fa-instagram"
      text: "Instagram <span class='link-button-text'>(@muhanned.kp)</span>"
      url: "https://www.instagram.com/muhanned.kp/"
      alt: "Muhanned KP on Instagram"
      title: "Follow on Instagram"
      target: "_blank"
  - link:
      icon: "fa-brands fa-facebook"
      text: "Facebook"
      url: "https://www.facebook.com/muhanned.kp/"
      alt: "Muhanned KP on Facebook"
      title: "Follow on Facebook"
      target: "_blank"

# -----------------------------------------------------------------------------
# Social media buttons
# -----------------------------------------------------------------------------
socials:
  - social:
      icon: "fa-brands fa-instagram"
      url: "https://www.instagram.com/muhanned.kp/"
      title: "Instagram"
      alt: "Instagram"
      target: "_blank"
  - social:
      icon: "fa-brands fa-youtube"
      url: "https://www.youtube.com/@muhannedkp"
      title: "YouTube"
      alt: "YouTube"
      target: "_blank"
  - social:
      icon: "fa-brands fa-facebook"
      url: "https://www.facebook.com/muhanned.kp/"
      title: "Facebook"
      alt: "Facebook"
      target: "_blank"

footer: >
    New IT, cloud and security tips every week. Follow along on your favourite platform.

copyright: >
  © {{ year }} Muhanned KP. Powered by <a href="https://github.com/ZhgChgLi/linkyee" target="_blank">linkyee</a>
